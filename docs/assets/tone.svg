<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Ton ayarları">
  <defs><style>.t{font-family:Inter,"Segoe UI",system-ui,sans-serif}.h{font-size:15px;font-weight:700;fill:#E6EAF7}.s{font-size:13px;fill:#AEB7DC}</style>
  <linearGradient id="trk" x1="0" x2="1"><stop offset="0" stop-color="#2A3A86"/><stop offset="1" stop-color="#5B7CFF"/></linearGradient></defs>
  <rect width="1200" height="330" rx="20" fill="#0B1026"/>
  <g class="t">
    <text x="40" y="44" font-size="20" font-weight="700" fill="#E8C547">Ton — içeriğin havası ayarlanır, yazma biçimi hep sana ait kalır</text>
    <g font-size="14" font-weight="600">
      <rect x="40" y="66" width="130" height="36" rx="18" fill="#5B7CFF"/><text x="105" y="89" text-anchor="middle" fill="#fff">Benim gibi</text>
      <rect x="182" y="66" width="150" height="36" rx="18" fill="#121A3A" stroke="#E8C547"/><text x="257" y="89" text-anchor="middle" fill="#E8C547">Özgüvenli</text>
      <rect x="344" y="66" width="90" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="389" y="89" text-anchor="middle" fill="#C3CBEA">Sade</text>
      <rect x="446" y="66" width="100" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="496" y="89" text-anchor="middle" fill="#C3CBEA">Samimi</text>
      <rect x="558" y="66" width="90" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="603" y="89" text-anchor="middle" fill="#C3CBEA">Flört</text>
    </g>
    <g transform="translate(40 130)">
      <g><text y="14" class="h">Flört seviyesi</text><rect x="260" y="2" width="520" height="8" rx="4" fill="#182248"/><rect x="260" y="2" width="364" height="8" rx="4" fill="url(#trk)"/><circle cx="624" cy="6" r="11" fill="#E8C547"/><text x="820" y="14" class="h" fill="#E8C547">7/10</text></g>
      <g transform="translate(0 48)"><text y="14" class="h">Cesaret</text><rect x="260" y="2" width="520" height="8" rx="4" fill="#182248"/><rect x="260" y="2" width="416" height="8" rx="4" fill="url(#trk)"/><circle cx="676" cy="6" r="11" fill="#E8C547"/><text x="820" y="14" class="h" fill="#E8C547">8/10</text></g>
      <g transform="translate(0 96)"><text y="14" class="h">Mizah</text><rect x="260" y="2" width="520" height="8" rx="4" fill="#182248"/><rect x="260" y="2" width="312" height="8" rx="4" fill="url(#trk)"/><circle cx="572" cy="6" r="11" fill="#E8C547"/><text x="820" y="14" class="h" fill="#E8C547">6/10</text></g>
      <g transform="translate(0 144)"><text y="14" class="h">Samimiyet</text><rect x="260" y="2" width="520" height="8" rx="4" fill="#182248"/><rect x="260" y="2" width="260" height="8" rx="4" fill="url(#trk)"/><circle cx="520" cy="6" r="11" fill="#E8C547"/><text x="820" y="14" class="h" fill="#E8C547">5/10</text></g>
    </g>
    <text x="40" y="318" class="s">Kişi başına ayrı ton · hedef (flört, arkadaşlık, iş, aile, barışma) ve notlarla birlikte modele bağlam olur.</text>
  </g>
</svg>
