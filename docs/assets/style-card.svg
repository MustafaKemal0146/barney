<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Stil kartı örneği">
  <defs><style>.t{font-family:Inter,"Segoe UI",system-ui,sans-serif}.h{font-size:15px;font-weight:700;fill:#E6EAF7}.s{font-size:13px;fill:#AEB7DC}.n{font-size:13px;font-weight:700}</style>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#5B7CFF"/><stop offset="1" stop-color="#8FA4FF"/></linearGradient>
  <linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#D9A92B"/><stop offset="1" stop-color="#F6D86B"/></linearGradient></defs>
  <rect width="1200" height="430" rx="20" fill="#0B1026"/>
  <g class="t">
    <text x="40" y="46" font-size="20" font-weight="700" fill="#E8C547">Stil kartı — sohbetten çıkan, kodla ölçülen parmak izi</text>
    <text x="40" y="70" class="s">Örnek veri. Yapay zekâ kullanılmadan hesaplanır; üretilen her cevap bu kurallara karşı kodla denetlenir.</text>

    <!-- sen -->
    <g transform="translate(40 96)">
      <rect width="548" height="300" rx="16" fill="#121A3A" stroke="#2A3A86"/>
      <circle cx="34" cy="34" r="16" fill="#5B7CFF"/><text x="34" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="#0B1026">S</text>
      <text x="62" y="40" class="h" font-size="17">Sen</text><text x="500" y="40" text-anchor="end" class="s">güven: yüksek · 1 240 mesaj</text>

      <text x="24" y="86" class="s">Arka arkaya mesaj atma</text>
      <rect x="24" y="96" width="500" height="14" rx="7" fill="#0B1026"/>
      <rect x="24" y="96" width="200" height="14" rx="7" fill="url(#bar)"/><rect x="224" y="96" width="240" height="14" fill="#7B93FF"/><rect x="464" y="96" width="60" height="14" rx="0" fill="#E8C547"/>
      <text x="24" y="130" class="s">tek %40</text><text x="224" y="130" class="s">2-3 mesaj %48</text><text x="464" y="130" class="s">4+ %12</text>

      <text x="24" y="168" class="s">Mesaj uzunluğu</text><rect x="24" y="178" width="500" height="10" rx="5" fill="#0B1026"/><rect x="24" y="178" width="120" height="10" rx="5" fill="url(#bar)"/><text x="530" y="188" text-anchor="end" class="n" fill="#E6EAF7">ortanca 3 sözcük</text>
      <text x="24" y="218" class="s">Küçük harfle başlama</text><rect x="24" y="228" width="500" height="10" rx="5" fill="#0B1026"/><rect x="24" y="228" width="425" height="10" rx="5" fill="url(#bar2)"/><text x="530" y="238" text-anchor="end" class="n" fill="#E6EAF7">%85</text>
      <text x="24" y="268" class="s">Noktalamasız bitirme</text><rect x="24" y="278" width="500" height="10" rx="5" fill="#0B1026"/><rect x="24" y="278" width="485" height="10" rx="5" fill="url(#bar2)"/><text x="530" y="288" text-anchor="end" class="n" fill="#E6EAF7">%97</text>
    </g>

    <!-- örnek balonlar -->
    <g transform="translate(628 96)">
      <rect width="532" height="300" rx="16" fill="#121A3A" stroke="#2A3A86"/>
      <text x="24" y="40" class="h" font-size="17">Üretilen cevap — kurallara uyar</text>
      <g transform="translate(24 62)">
        <rect width="236" height="40" rx="20" fill="#5B7CFF"/><text x="18" y="25" font-size="14" fill="#fff">yok ya iyiyim</text>
        <rect y="50" width="300" height="40" rx="20" fill="#5B7CFF"/><text x="18" y="75" font-size="14" fill="#fff">sadece çok çalışıyorum</text>
        <text x="320" y="75" class="s" fill="#8D97C4">⏱ 4 sn</text>
      </g>
      <g transform="translate(24 176)">
        <rect width="484" height="96" rx="14" fill="#0B1026" stroke="#1F2A5C"/>
        <text x="16" y="28" class="s">Denetim (kodla)</text>
        <g font-size="13"><text x="16" y="52" fill="#4ADE80">✓ 2 mesaj (hedef 2)</text><text x="180" y="52" fill="#4ADE80">✓ küçük harf</text><text x="300" y="52" fill="#4ADE80">✓ noktalama yok</text>
        <text x="16" y="76" fill="#4ADE80">✓ uzunluk aralığında</text><text x="180" y="76" fill="#4ADE80">✓ emoji yok</text><text x="300" y="76" fill="#F5B94A">⚠ kart güveni: orta</text></g>
      </g>
    </g>
  </g>
</svg>
