<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Barney — Senin gibi yazan yazışma asistanı">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#16225A"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6"><stop offset="0" stop-color="#5B7CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#5B7CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D86B"/><stop offset="1" stop-color="#D9A92B"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1F2A5C" stroke-width="1" opacity="0.55"/></pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .t{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
      .dot{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .d2{animation-delay:.2s}.d3{animation-delay:.4s}
      @keyframes pulse{0%,60%,100%{opacity:.35;transform:scale(.8)}30%{opacity:1;transform:scale(1.15)}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <circle cx="1010" cy="110" r="130" fill="#5B7CFF" opacity="0.18" filter="url(#soft)"/>

  <!-- papyon -->
  <g transform="translate(1000 150)"><g class="float">
    <path d="M0 0 L-120 -62 Q-138 -40 -138 0 Q-138 40 -120 62 Z" fill="url(#gold)"/>
    <path d="M0 0 L120 -62 Q138 -40 138 0 Q138 40 120 62 Z" fill="url(#gold)"/>
    <path d="M-120 -62 L0 0 M-120 62 L0 0 M120 -62 L0 0 M120 62 L0 0" stroke="#B98A1B" stroke-width="2" opacity=".5"/>
    <rect x="-30" y="-36" width="60" height="72" rx="14" fill="#5B7CFF"/>
    <rect x="-30" y="-36" width="60" height="72" rx="14" fill="none" stroke="#9DB0FF" stroke-width="2" opacity=".6"/>
  </g></g>

  <!-- başlık -->
  <text x="70" y="132" class="t" font-size="76" font-weight="800" fill="#E6EAF7" letter-spacing="-2">Barney<tspan fill="#E8C547">.</tspan></text>
  <text x="72" y="178" class="t" font-size="30" font-weight="600" fill="#E8C547" letter-spacing="1">Senin gibi yazar.</text>
  <text x="72" y="228" class="t" font-size="22" fill="#C3CBEA">Yazışma tarzını öğrenir, <tspan font-weight="700" fill="#E6EAF7">senin gibi</tspan> yazar —</text>
  <text x="72" y="258" class="t" font-size="22" fill="#C3CBEA">öneri verir, ister tek tıkla gönderir. Hepsi kendi bilgisayarında.</text>

  <!-- rozetler -->
  <g class="t" font-size="15" font-weight="600">
    <rect x="72" y="296" width="130" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="137" y="319" text-anchor="middle" fill="#9DB0FF">Yerel &amp; gizli</text>
    <rect x="214" y="296" width="168" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="298" y="319" text-anchor="middle" fill="#9DB0FF">Senin üslubunla</text>
    <rect x="394" y="296" width="150" height="36" rx="18" fill="#121A3A" stroke="#2A3A86"/><text x="469" y="319" text-anchor="middle" fill="#9DB0FF">Kontrol sende</text>
  </g>

  <!-- yazıyor balonu -->
  <g transform="translate(790 292)">
    <rect width="120" height="46" rx="23" fill="#182248" stroke="#2A3A86"/>
    <circle class="dot" cx="38" cy="23" r="6" fill="#E8C547"/>
    <circle class="dot d2" cx="60" cy="23" r="6" fill="#E8C547"/>
    <circle class="dot d3" cx="82" cy="23" r="6" fill="#E8C547"/>
  </g>
</svg>
