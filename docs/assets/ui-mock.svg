<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Barney arayüzü">
  <defs><style>.t{font-family:Inter,"Segoe UI",system-ui,sans-serif}.h{font-size:15px;font-weight:700;fill:#E6EAF7}.s{font-size:12.5px;fill:#AEB7DC}.k{font-size:11.5px;fill:#8D97C4}</style>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1431"/><stop offset="1" stop-color="#0B1026"/></linearGradient></defs>
  <rect width="1200" height="660" rx="20" fill="#070B1C"/>
  <rect x="20" y="20" width="1160" height="620" rx="14" fill="url(#win)" stroke="#2A3A86"/>
  <g class="t">
    <!-- pencere çubuğu -->
    <circle cx="44" cy="42" r="6" fill="#FF6B7A"/><circle cx="64" cy="42" r="6" fill="#F5B94A"/><circle cx="84" cy="42" r="6" fill="#4ADE80"/>
    <!-- üst çubuk -->
    <rect x="21" y="62" width="1158" height="44" fill="#0B1026"/><line x1="21" y1="106" x2="1179" y2="106" stroke="#1F2A5C"/>
    <rect x="260" y="72" width="150" height="26" rx="13" fill="#10331F" stroke="#4ADE80" stroke-opacity=".6"/><text x="335" y="90" text-anchor="middle" font-size="12.5" fill="#4ADE80">● Uzantı bağlı</text>
    <rect x="420" y="72" width="170" height="26" rx="13" fill="#10331F" stroke="#4ADE80" stroke-opacity=".6"/><text x="505" y="90" text-anchor="middle" font-size="12.5" fill="#4ADE80">● Model anahtarı var</text>
    <rect x="1070" y="72" width="90" height="26" rx="8" fill="#FF6B7A"/><text x="1115" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">■ Durdur</text>
    <text x="44" y="92" font-size="17" font-weight="800" fill="#E6EAF7">Barney<tspan fill="#E8C547">.</tspan></text>

    <!-- yan çubuk -->
    <rect x="21" y="107" width="230" height="533" fill="#0B1026"/><line x1="251" y1="107" x2="251" y2="640" stroke="#1F2A5C"/>
    <rect x="36" y="122" width="200" height="38" rx="10" fill="#121A3A" stroke="#2A3A86"/><text x="136" y="146" text-anchor="middle" class="h" font-size="13.5">＋ Kişi ekle</text>
    <g transform="translate(36 176)">
      <rect width="200" height="56" rx="12" fill="#182248" stroke="#5B7CFF"/><circle cx="28" cy="28" r="15" fill="#5B7CFF" opacity=".35"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#9DB0FF">N</text>
      <text x="52" y="25" class="h" font-size="13.5">Deniz</text><text x="52" y="43" class="k">1 240 mesaj · 2 sa</text></g>
    <g transform="translate(36 242)"><rect width="200" height="56" rx="12" fill="none" stroke="#1F2A5C"/><circle cx="28" cy="28" r="15" fill="#E8C547" opacity=".25"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#E8C547">K</text><text x="52" y="25" class="h" font-size="13.5">Kaan</text><text x="52" y="43" class="k">860 mesaj · 3 gündür sessiz</text></g>
    <g transform="translate(36 308)"><rect width="200" height="56" rx="12" fill="none" stroke="#1F2A5C"/><circle cx="28" cy="28" r="15" fill="#4ADE80" opacity=".25"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="#4ADE80">M</text><text x="52" y="25" class="h" font-size="13.5">Melis</text><text x="52" y="43" class="k">310 mesaj · dün</text></g>
    <text x="48" y="618" class="s">⚙ Ayarlar</text>

    <!-- ana alan -->
    <text x="276" y="140" class="h" font-size="18">Deniz</text>
    <g font-size="13.5"><text x="276" y="172" fill="#E6EAF7" font-weight="700">Sohbet</text><rect x="276" y="178" width="46" height="3" rx="2" fill="#5B7CFF"/>
      <text x="344" y="172" class="s">Canlı</text><text x="396" y="172" class="s">Stil</text><text x="436" y="172" class="s">Analiz</text><text x="490" y="172" class="s">Hafıza</text><text x="548" y="172" class="s">Geçmiş</text><text x="606" y="172" class="s">Ayarlar</text></g>
    <line x1="252" y1="190" x2="1179" y2="190" stroke="#1F2A5C"/>
    <rect x="276" y="204" width="212" height="34" rx="10" fill="#5B7CFF"/><text x="382" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Danışman</text>
    <rect x="488" y="204" width="130" height="34" rx="10" fill="#121A3A" stroke="#2A3A86"/><text x="553" y="226" text-anchor="middle" font-size="13" fill="#C3CBEA">Rol provası</text>
    <text x="1156" y="226" text-anchor="end" class="s">Ton · Özgüvenli</text>

    <!-- mesajlar -->
    <g transform="translate(276 256)">
      <rect x="380" width="480" height="52" rx="14" fill="#5B7CFF"/><text x="396" y="22" font-size="13.5" fill="#fff">Deniz "bugün kötü gördüm seni" yazdı, ne diyeyim?</text><text x="396" y="40" font-size="11.5" fill="#DDE4FF" opacity=".8">Sen</text>
      <rect width="540" height="86" rx="14" fill="#121A3A" stroke="#2A3A86"/>
      <text x="16" y="24" font-size="13.5" fill="#E6EAF7">Hassas bir an: önce ilgi göster, çözüm üretme. Şunu öneririm:</text>
      <text x="16" y="48" font-size="13.5" fill="#E8C547">"yok ya iyiyim, sadece çok çalışıyorum"</text>
      <text x="16" y="70" class="s">Barney · senin tarzında, 2 mesaj</text>
    </g>

    <!-- aday kartı -->
    <g transform="translate(276 372)">
      <rect width="880" height="184" rx="14" fill="#121A3A" stroke="#5B7CFF"/>
      <text x="18" y="30" class="h">Cevap adayları</text><text x="860" y="30" text-anchor="end" class="k">⏱ bekleme kodla hesaplanır</text>
      <g transform="translate(18 44)"><rect width="260" height="124" rx="12" fill="#0B1026" stroke="#2A3A86"/>
        <rect x="12" y="12" width="64" height="20" rx="10" fill="#4ADE80" fill-opacity=".18"/><text x="44" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ADE80">güvenli ★</text>
        <text x="12" y="56" class="s">⏱ 15 sn</text><text x="12" y="74" font-size="13.5" fill="#E6EAF7">yok ya iyiyim</text>
        <rect x="12" y="90" width="76" height="26" rx="8" fill="#5B7CFF"/><text x="50" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Gönder</text>
        <rect x="96" y="90" width="84" height="26" rx="8" fill="#121A3A" stroke="#2A3A86"/><text x="138" y="108" text-anchor="middle" font-size="12" fill="#C3CBEA">Kutuya yaz</text></g>
      <g transform="translate(300 44)"><rect width="260" height="124" rx="12" fill="#0B1026" stroke="#2A3A86"/>
        <rect x="12" y="12" width="52" height="20" rx="10" fill="#E8C547" fill-opacity=".18"/><text x="38" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#E8C547">komik</text>
        <text x="12" y="56" class="s">⏱ 9 sn</text><text x="12" y="74" font-size="13.5" fill="#E6EAF7">çay söylüyorum, anlat bakalım</text>
        <rect x="12" y="90" width="76" height="26" rx="8" fill="#5B7CFF"/><text x="50" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Gönder</text></g>
      <g transform="translate(582 44)"><rect width="280" height="124" rx="12" fill="#0B1026" stroke="#F5B94A" stroke-opacity=".7"/>
        <rect x="12" y="12" width="52" height="20" rx="10" fill="#FF6B7A" fill-opacity=".18"/><text x="38" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FF6B7A">cesur</text>
        <text x="12" y="56" fill="#F5B94A" font-size="12">⚠ emin değil · hassas konu</text><text x="12" y="76" font-size="13.5" fill="#E6EAF7">akşam görüşelim mi, anlatırsın</text>
        <text x="12" y="108" class="k">göndermeden önce kendin oku</text></g>
    </g>
    <rect x="276" y="574" width="800" height="44" rx="12" fill="#0B1026" stroke="#2A3A86"/><text x="294" y="602" class="s">Barney'e danış…</text>
    <rect x="1090" y="574" width="66" height="44" rx="12" fill="#5B7CFF"/><text x="1123" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">➤</text>
  </g>
</svg>
